[package]
name = "habit"
version = "0.9.1"
edition = "2024"
rust-version = "1.88"
description = "A calm terminal habit tracker: streaks, quotas, cheat days, tags, notes, plain JSON"
license = "MIT"
repository = "https://github.com/Vulkan1125/habit-tracker.git"
homepage = "https://github.com/Vulkan1125/habit-tracker"
readme = "README.md"
keywords = ["habit", "tui", "tracker", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
